name: Android Release (fork)

# Builds an installable Android APK and attaches it to a GitHub Release.
#
# Why a separate workflow: the upstream `release.yml` needs GCP, Play Store,
# fastlane match and App Store Connect credentials that a fork does not have, so
# it cannot run here. This one needs no secrets at all —
#   * `android/app/debug.keystore` is committed, so `assembleProdDebug` is signed
#     out of the box and the APK updates an already installed build;
#   * `assembleProdRelease` falls back to the same debug keystore when no release
#     signing secrets are present (see android/app/build.gradle);
#   * google-services.json is generated as a dummy, exactly like ci.yml does.
#
# Run it from Actions → "Android Release (fork)" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.21.2-local-server). Empty = android-<version>-<date>-<run>'
        required: false
        default: ''
      variant:
        description: 'Build variant'
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release
      abis:
        description: 'Comma separated ABIs (empty = all; arm64-v8a covers modern phones)'
        required: false
        default: 'arm64-v8a'
      publish:
        description: 'Create or update the GitHub Release with the APK'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The image ships JDK 17 inside /opt/hostedtoolcache, which the space trim
      # below deletes. Copy it out first: actions/setup-java would then download
      # a JDK from the Adoptium mirror, and that download failed with HTTP 504
      # on the first run of this workflow.
      - name: Keep the preinstalled JDK 17
        id: jdk
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -x "$JAVA_HOME_17_X64/bin/java" ]; then
            sudo cp -a "$JAVA_HOME_17_X64" /opt/jdk17
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using the preinstalled JDK 17 from $JAVA_HOME_17_X64"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No preinstalled JDK 17, will download one"
          fi

      # ~14 GB free is not enough for a from-source llama.rn build plus the
      # Android SDK; the runner image ships several GB of toolchains we do not
      # use. Same trim as ci.yml.
      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Use the preinstalled JDK 17
        if: steps.jdk.outputs.found == 'true'
        run: |
          echo "JAVA_HOME=/opt/jdk17" >> "$GITHUB_ENV"
          echo "/opt/jdk17/bin" >> "$GITHUB_PATH"
          java -version

      - name: Download JDK 17 (preinstalled copy missing)
        if: steps.jdk.outputs.found != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn

      # Warm runs skip the install and the artifact fetch below entirely.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # llama.rn's postinstall downloads both the Android JNI libs and a 309 MB
      # iOS xcframework from GitHub Releases, with no retry at all. That download
      # kept returning HTTP 503 from the runners. The postinstall is therefore
      # skipped (RNLLAMA_SKIP_POSTINSTALL=1) and the 50 MB Android archive is
      # fetched below instead, which is all an Android build needs.
      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      # Retried because a cold run still pulls packages over the network.
      - name: Install dependencies
        env:
          RNLLAMA_SKIP_POSTINSTALL: '1'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if yarn install --frozen-lockfile --network-timeout 600000; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::yarn install failed after 3 attempts"
              exit 1
            fi
            echo "::warning::yarn install failed (attempt $attempt/3), retrying"
            sleep $((attempt * 20))
          done

      # llama.rn's postinstall is skipped above and only the 50 MB Android
      # archive is fetched (an Android build has no use for the 309 MB iOS
      # xcframework). GitHub's release CDN has answered these downloads with
      # HTTP 503 during an incident, so it is retried here rather than letting
      # the first bad response fail the run. The archive is verified against
      # the checksum in llama.rn's own manifest before it is extracted where
      # the postinstall would have put it.
      - name: Fetch llama.rn Android native libraries
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').dependencies['llama.rn']")
          EXPECTED=$(node -e "
            const manifest = require('./node_modules/llama.rn/install/native-artifacts.json');
            const artifact = manifest.artifacts.find((a) => a.name === 'android-jni-libs');
            process.stdout.write(artifact && artifact.sha256 ? artifact.sha256 : '');
          ")

          if [ -z "$EXPECTED" ]; then
            echo "::warning::llama.rn manifest carries no checksum; nothing to verify, skipping the fetch"
            exit 0
          fi

          JNI_LIBS=node_modules/llama.rn/android/src/main/jniLibs
          INSTALLED=$(cat "$JNI_LIBS/.llama-rn.sha256" 2>/dev/null || true)
          if [ "$INSTALLED" = "$EXPECTED" ]; then
            echo "Android JNI libs already installed for llama.rn $VERSION"
            exit 0
          fi

          TARBALL="$RUNNER_TEMP/llama-rn-android-jni-libs.tar.gz"
          URL="https://github.com/mybigday/llama.rn/releases/download/v${VERSION}/llama-rn-android-jni-libs.tar.gz"

          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 600 \
              --connect-timeout 20 -o "$TARBALL" "$URL"
            then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not download llama.rn's native libraries after 5 attempts."
              exit 1
            fi
            echo "::warning::Download failed (attempt ${attempt}/5), retrying"
            sleep $((attempt * 30))
          done

          echo "${EXPECTED}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" -C node_modules/llama.rn
          test -d "$JNI_LIBS"
          printf '%s\n' "$EXPECTED" > "$JNI_LIBS/.llama-rn.sha256"
          du -sh "$JNI_LIBS"

      # com.google.gms.google-services is applied unconditionally, but the file
      # is gitignored. A dummy keeps the build tool happy; it carries no real
      # project.
      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.pocketpalai"
                }
              },
              "api_key": [{
                "current_key": "dummy-api-key-for-ci-builds"
              }]
            }]
          }
          EOL

      - name: Build APK
        working-directory: android
        env:
          # Left empty the property is not passed, so gradle.properties picks the
          # ABI set. The default input narrows it to arm64-v8a: it covers modern
          # phones and roughly halves the build time and APK size.
          ABIS: ${{ inputs.abis }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          TASK=":app:assembleProdDebug"
          if [ "$VARIANT" = "release" ]; then
            TASK=":app:assembleProdRelease"
          fi
          GRADLE_ARGS=(--no-daemon --stacktrace --warning-mode=summary)
          if [ -n "${ABIS:-}" ]; then
            GRADLE_ARGS+=("-PreactNativeArchitectures=${ABIS}")
          fi
          ./gradlew "$TASK" "${GRADLE_ARGS[@]}"

      - name: Collect the APK
        id: apk
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          if [ "$VARIANT" = "release" ]; then
            APK="android/app/build/outputs/apk/prod/release/app-prod-release.apk"
          else
            APK="android/app/build/outputs/apk/prod/debug/app-prod-debug.apk"
          fi
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found: $APK"
            find android/app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < .version)
          NAME="PocketPal-${VERSION}-${VARIANT}.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          {
            echo "path=dist/$NAME"
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "sha256=$(sha256sum "dist/$NAME" | cut -d' ' -f1)"
            echo "size=$(stat -c%s "dist/$NAME")"
          } >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Resolve the release tag
        id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-}"
          if [ -z "$TAG" ]; then
            TAG="android-${{ steps.apk.outputs.version }}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      # Same repository tag + same asset name means a re-run replaces the APK
      # instead of failing on "asset already exists".
      - name: Publish the GitHub Release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PocketPal ${{ steps.apk.outputs.version }} (Android ${{ inputs.variant }})
          body: |
            Android ${{ inputs.variant }} build from `${{ github.sha }}`.

            - variant: `${{ inputs.variant }}`
            - ABIs: `${{ inputs.abis || 'all' }}`
            - size: ${{ steps.apk.outputs.size }} bytes
            - sha256: `${{ steps.apk.outputs.sha256 }}`

            ```bash
            adb install -r ${{ steps.apk.outputs.name }}
            ```
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Summary
        run: |
          {
            echo "### Android ${{ inputs.variant }} build"
            echo
            echo "- APK: \`${{ steps.apk.outputs.path }}\`"
            echo "- Size: ${{ steps.apk.outputs.size }} bytes"
            echo "- SHA-256: \`${{ steps.apk.outputs.sha256 }}\`"
            echo "- Tag: \`${{ steps.meta.outputs.tag }}\`"
            echo "- Release: ${{ inputs.publish }}"
          } >> "$GITHUB_STEP_SUMMARY"
